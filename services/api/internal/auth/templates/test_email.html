<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.AppName}} — SMTP-Test</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:40px 0;">
  <tr>
    <td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;max-width:600px;width:100%;">
        <tr>
          <td style="background-color:#1a1a2e;padding:24px 32px;">
            <span style="color:#ffffff;font-size:20px;font-weight:bold;">{{.AppName}}</span>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;">
            <h2 style="margin:0 0 16px 0;color:#1a1a2e;font-size:22px;">SMTP-Konfiguration erfolgreich</h2>
            <p style="margin:0 0 16px 0;color:#444444;font-size:15px;line-height:1.6;">
              Hallo {{.Username}},
            </p>
            <p style="margin:0 0 16px 0;color:#444444;font-size:15px;line-height:1.6;">
              diese Test-Email bestätigt, dass die SMTP-Konfiguration von {{.AppName}} korrekt funktioniert.
              Email-Benachrichtigungen (Verifizierung, Passwort-Reset, Einladungen) sind einsatzbereit.
            </p>
          </td>
        </tr>
        <tr>
          <td style="background-color:#f4f4f4;padding:16px 32px;border-top:1px solid #e0e0e0;">
            <p style="margin:0;color:#888888;font-size:12px;text-align:center;">
              &copy; {{.AppName}} &mdash; <a href="{{.AppURL}}" style="color:#888888;">{{.AppURL}}</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
