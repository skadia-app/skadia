cache_size_mb: 0

postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 20
  auto_publish:
    tables: false
    functions: false
  functions:
    heatmap_lines:
      schema: public
      function: heatmap_lines_mvt
    heatmap_points:
      schema: public
      function: heatmap_points_mvt
    waters:
      schema: public
      function: waters_mvt
    forests:
      schema: public
      function: forests_mvt

  tables:
    # Trail-/Wege-Netz für Routing-Overlay (osm_ways, ehem. osm_trails)
    osm_ways:
      schema: public
      table: osm_ways
      geometry_column: geom
      srid: 4326
      id_column: id
      minzoom: 10
      maxzoom: 22
      properties:
        highway: varchar
        surface: varchar
        tracktype: text
        sac_scale: varchar
        mtb_scale: varchar
        cycleway: varchar
        name: text
        oneway: boolean
        bridge: boolean
        tunnel: boolean
        is_lift: boolean
        length_m: float8
        avg_slope: float8

    # POIs (Gipfel, Pässe, Amenities — ehem. osm_peaks + osm_amenities)
    pois_mvt:
      schema: public
      table: osm_pois
      geometry_column: geom
      srid: 4326
      id_column: id
      properties:
        osm_id: int8
        name: varchar
        category: varchar
        subtype: varchar
        ele: float4
      bounds: [-180, -90, 180, 90]

    # Pisten (Ski/Snowboard)
    pistes_mvt:
      schema: public
      table: osm_pistes
      geometry_column: geom
      srid: 4326
      id_column: id
      properties:
        name: varchar
        piste_type: varchar
        difficulty: varchar
        grooming: varchar
      bounds: [-180, -90, 180, 90]

