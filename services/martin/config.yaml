cache_size_mb: 0

postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 20
  auto_publish:
    tables: false
    functions: false
  functions:
    heatmap_lines:
      schema: public
      function: heatmap_lines_mvt
    heatmap_points:
      schema: public
      function: heatmap_points_mvt
    waters:
      schema: public
      function: waters_mvt
    forests:
      schema: public
      function: forests_mvt

  tables:
    # POIs (Gipfel, Pässe, Amenities — ehem. osm_peaks + osm_amenities)
    pois_mvt:
      schema: public
      table: osm_pois
      geometry_column: geom
      srid: 4326
      id_column: id
      properties:
        osm_id: int8
        name: varchar
        category: varchar
        subtype: varchar
        ele: float4
      bounds: [-180, -90, 180, 90]

    # HINWEIS: Die folgenden Table-Sources sind temporär deaktiviert, weil Martin
    # v1.3.1 nach dem Software-Update bei SRID-Mismatch (erkennt 3857, Config sagt 4326)
    # und unsupportedem 'sql:'-Key mit Exit-Code 1 crasht.
    # osm_roads verwendet 'sql:' (unsupported in Martin table sources).
    # osm_ways, osm_routes, pistes_mvt: Martin-SRID-Erkennungs-Bug (Daten sind 4326).
    # Heatmap/Tracks funktionieren über Function-Sources (heatmap_lines, heatmap_points).
    # TODO: Untersuchen warum Martin SRID=3857 für geometry(LineString,4326) meldet.
    #
    # osm_ways:
    #   schema: public
    #   table: osm_ways
    #   geometry_column: geom
    #   srid: 4326
    #   id_column: id
    #   ...
    #
    # osm_routes:
    #   schema: public
    #   table: osm_routes
    #   geometry_column: geom
    #   srid: 4326
    #   id_column: id
    #   ...
    #
    # pistes_mvt:
    #   schema: public
    #   table: osm_pistes
    #   ...
    #
    # osm_roads (uses unsupported 'sql:' key):
    #   table: osm_ways
    #   sql: SELECT ... WHERE highway IN (...)

