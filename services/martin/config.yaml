cache_size_mb: 0

postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 20
  auto_publish:
    tables: false
    functions: false
  functions:
    heatmap_lines:
      schema: public
      function: heatmap_lines_mvt
    heatmap_points:
      schema: public
      function: heatmap_points_mvt
    peaks:
      schema: public
      function: peaks_mvt
    waters:
      schema: public
      function: waters_mvt
    forests:
      schema: public
      function: forests_mvt
    amenities:
      schema: public
      function: amenities_mvt

  tables:
    # Trail-Netz für Routing-Overlay (Full-Modus: osm_trails befüllt)
    osm_trails:
      schema: public
      table: osm_trails
      geometry_column: geom
      srid: 4326
      id_column: id
      minzoom: 10
      maxzoom: 22
      properties:
        highway: text
        surface: text
        tracktype: text
        sac_scale: text
        mtb_scale: text
        name: text
        oneway: boolean
        bridge: boolean
        tunnel: boolean
        is_lift: boolean
        length_m: float8
        avg_slope: float8

