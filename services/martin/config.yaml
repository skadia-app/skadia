cache_size_mb: 0

postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 20
  auto_publish:
    tables: false
    functions: false
  functions:
    heatmap_lines:
      schema: public
      function: heatmap_lines_mvt
    heatmap_points:
      schema: public
      function: heatmap_points_mvt
    peaks:
      schema: public
      function: peaks_mvt
    waters:
      schema: public
      function: waters_mvt
    forests:
      schema: public
      function: forests_mvt
    amenities:
      schema: public
      function: amenities_mvt

# Lokale Base-Map MBTiles/PMTiles
mbtiles:
  paths:
    - /data/tiles/
