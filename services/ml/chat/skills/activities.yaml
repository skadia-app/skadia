name: activities
description: "Aktivitäten, Trainings, Pace, Distanz, Sport-Typen"
schema_excerpt: |
  activities: id UUID, user_id UUID, sport_type TEXT, sub_type TEXT,
    is_electric BOOL, is_indoor BOOL, is_virtual BOOL, is_commute BOOL, title TEXT,
    started_at TIMESTAMPTZ, elapsed_time_s INT, moving_time_s INT, distance_m REAL,
    elevation_gain_m REAL, avg_heart_rate SMALLINT, max_heart_rate SMALLINT,
    avg_speed_ms REAL (m/s), total_calories INT, start_city TEXT, start_location TEXT
  activity_laps: activity_id, message_index, total_distance_m, total_elapsed_time_s, avg_heart_rate, max_heart_rate
  activity_splits: activity_id, message_index, total_distance_m, total_elapsed_time_s, avg_speed_ms
domain_knowledge: |
  - Pace berechnen: (1000.0 / avg_speed_ms) / 60.0 = min/km
  - Speed berechnen: avg_speed_ms * 3.6 = km/h
  - Dauer: elapsed_time_s / 3600 = Stunden
  - Distanz: distance_m / 1000 = km
  - Sport-Typen: running, cycling, hiking, walking, swimming,
    skiing, alpine_skiing, cross_country_skiing, strength, strength_training,
    mountaineering, paddling, canoeing
  - Sub-Typen: MTB = sport_type cycling + sub_type mountain;
    Gravel = cycling + gravel_cycling; Indoor-Rad = cycling + indoor_cycling;
    Trail-Lauf = running + trail; Freiwasser = swimming + open_water
  - E-Bike ist kein eigener Sport-Typ, sondern cycling + is_electric=true
  - Indoor, Virtual und Pendeln sind Modifier: is_indoor/is_virtual/is_commute
  - Allgemein vs. spezifisch: Ski allgemein = skiing; Alpin-Ski = alpine_skiing;
    Kraft allgemein = strength; Krafttraining = strength_training
tools:
  - query_activities
  - aggregate_stats
  - compare_periods
few_shot_examples:
  - q: "Wie weit bin ich diese Woche gelaufen?"
    tool: aggregate_stats
    args: '{"metric": "total_distance", "sport_type": "running", "days": 7}'
    answer: "Diese Woche 3 Läufe, 28.4 km gesamt. Längster: 12.1 km am Montag."
  - q: "Was war mein schnellster 10k?"
    tool: query_activities
    args: '{"sport_type": "running", "sort_by": "duration", "limit": 10}'
    answer: "Dein schnellster Lauf über ~10 km: 48:12 min am 15.01. (Pace 4:49 min/km)."
  - q: "Wie oft war ich letztes Jahr Rad fahren?"
    tool: aggregate_stats
    args: '{"metric": "count", "sport_type": "cycling", "days": 365}'
    answer: "42 Radtouren in den letzten 12 Monaten, 1.847 km gesamt."
