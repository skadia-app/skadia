name: training
description: "CTL, ATL, TSB, ACWR, Periodisierung, Trainingszonen"
schema_excerpt: |
  pmc_daily: user_id, date, tss REAL, ctl REAL (Fitness/42d), atl REAL (Müdigkeit/7d),
    tsb REAL (Form = CTL - ATL)
domain_knowledge: |
  - TSB (Form): <-30 überlastet, -30..-10 produktiv, -10..+5 optimal, >+15 Formverlust
  - ACWR: ATL/CTL Ratio. <0.8 unterbelastet, 0.8-1.3 optimal, >1.5 Verletzungsrisiko
  - CTL steigend = Fitnessaufbau, CTL fallend = Detraining
  - TSS (Training Stress Score): basiert auf Dauer × Intensität relativ zu FTP
tools:
  - get_training_load
  - compare_periods
  - get_analytics
few_shot_examples:
  - q: "Wie ist meine aktuelle Form?"
    tool: get_training_load
    args: '{"days": 42}'
    answer: "CTL 65 (Fitness aufbauend), ATL 72, TSB -7 (optimal). ACWR 1.11 (sweet spot)."
  - q: "Trainiere ich zu viel?"
    tool: get_training_load
    args: '{"days": 30}'
    answer: "ACWR 1.52 — erhöhtes Risiko! ATL stieg in 2 Wochen um 40%. Empfehlung: Regenerationswoche."
