model_list:
  # llama-server Backend (Host-native, Vulkan/AMD Vega 56, Port 8181)
  # Starten mit: ./scripts/llama-server.sh
  - model_name: skadia-default
    litellm_params:
      model: openai/qwen3-8b
      api_base: http://host.containers.internal:8181/v1
      api_key: "none"
  - model_name: skadia-llama-default
    litellm_params:
      model: openai/qwen3-8b
      api_base: http://host.containers.internal:8181/v1
      api_key: "none"
  - model_name: skadia-llama-vlm
    litellm_params:
      model: openai/qwen3-vl
      api_base: http://host.containers.internal:8181/v1
      api_key: "none"
  # Ollama-Backend (Fallback)
  - model_name: skadia-ollama-default
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434
  - model_name: skadia-vlm
    litellm_params:
      model: ollama/qwen3-vl:8b
      api_base: http://ollama:11434
  - model_name: skadia-vlm-fallback
    litellm_params:
      model: ollama/qwen3-vl:4b
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true
  request_timeout: 120
