api:
  dashboard: false

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  traefik:
    address: ":8082"

providers:
  docker:
    exposedByDefault: false
    network: skadia_default
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web

ping:
  entryPoint: traefik

log:
  level: WARN
