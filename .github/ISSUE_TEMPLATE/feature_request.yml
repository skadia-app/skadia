name: Feature request
description: Suggest a new feature or behaviour change.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What problem does this solve? Describe the use case, not the
        solution yet. "I want to import X from Y" is a problem; "add an
        X importer" is a solution. We may have a different solution in
        mind.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: |
        Your suggested approach. Be specific where you can; rough sketch
        where you can't.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you rejected them.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Links to relevant upstream discussions, similar features in other
        projects, screenshots/mockups, etc.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Help us decide whether this fits the project.
      options:
        - label: This affects user-visible behaviour (a CHANGELOG entry would describe it)
        - label: This is a new integration with an external service
        - label: This is a developer-experience / refactor item
        - label: This is a documentation request
