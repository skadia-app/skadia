name: Verified-Secret Sweep

# Daily deep scan with TruffleHog live-verification. Catches:
#   - tokens that landed weeks ago via --no-verify (bypassing the local hook)
#   - tokens whose pattern wasn't in gitleaks' rule set at commit time
#   - credentials still active long after their commit removed them locally
#
# `--only-verified` means a finding is a credential that ACTUALLY WORKS
# against the live API right now — these require immediate rotation, not
# just history rewrite. The pre-commit-guard.yml gitleaks job covers the
# per-PR shallow-scan case; this complements it with the deep + verified
# layer.

on:
  schedule:
    # Daily 04:37 UTC. Off-peak so a fresh finding shows up before any new
    # commit on the day, not in the middle of a busy review window.
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned by SHA against tag-move attacks.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install TruffleHog
        # Direct binary download from the official release. Pinned to a
        # specific version + SHA-256 of the tarball. Avoids the
        # trufflesecurity/trufflehog action, which has had supply-chain
        # incidents on `@main` in the past — a versioned binary download
        # with content-addressed verification is the lower-risk path.
        env:
          TH_VERSION: v3.95.2
          # SHA-256 of trufflehog_3.95.2_linux_amd64.tar.gz from the
          # release's official checksums.txt. Bump together with TH_VERSION
          # when upgrading.
          TH_TARBALL_SHA256: fded1c139fe4d3872d9fde65e1428d82d5556d655439e82f492d87ae8d846779
        run: |
          set -euo pipefail
          NUM="${TH_VERSION#v}"
          TARBALL="/tmp/th.tar.gz"
          curl -sSfL -o "$TARBALL" \
              "https://github.com/trufflesecurity/trufflehog/releases/download/${TH_VERSION}/trufflehog_${NUM}_linux_amd64.tar.gz"
          echo "${TH_TARBALL_SHA256}  ${TARBALL}" | sha256sum -c -
          mkdir -p /tmp/th && tar -xzf "$TARBALL" -C /tmp/th
          install -m 0755 /tmp/th/trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      - name: Scan full git history (verified only)
        # `--fail` exits non-zero when a verified credential is found.
        # That turns the workflow red, which sends the repo owner a
        # notification email — the trigger to rotate the leaked credential
        # immediately.
        #
        # Stale-finding suppression: if a credential has been ROTATED but
        # still exists in git history (filter-repo not yet applied), the
        # daily verified-scan would otherwise alert forever. Mitigation:
        # add the containing path to .trufflehog-exclude-paths.txt and
        # this workflow will skip scanning it. Format = list of regex
        # patterns, one per line (TruffleHog `--exclude-paths` syntax).
        run: |
          if [ -f .trufflehog-exclude-paths.txt ]; then
            trufflehog git file://. --only-verified --fail --no-update --json \
              --exclude-paths=.trufflehog-exclude-paths.txt
          else
            trufflehog git file://. --only-verified --fail --no-update --json
          fi
