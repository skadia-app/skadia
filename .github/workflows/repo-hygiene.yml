name: Repo Hygiene

# Static analysis on the repo's own meta-files:
#   - actionlint   — GitHub Actions YAML lint (catches syntax, expression,
#                    matrix-key bugs the agent commonly introduces)
#   - zizmor       — GitHub Actions security audit (script injections,
#                    over-permissive `permissions:`, dangerous
#                    pull_request_target patterns)
#   - large-files  — server-side mirror of .githooks/pre-commit Check 1.
#                    Catches binaries that slipped through `--no-verify` or
#                    were committed before the local hook was activated.
#   - hadolint     — Dockerfile linting (best-practice + safety rules:
#                    pinned base images, USER directives, layer hygiene)
#   - shellcheck   — shell-script linting on scripts/ and .githooks/

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint (GHA YAML lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned by SHA against tag-move attacks.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run actionlint
        # raven-actions/actionlint v2 — pinned by SHA.
        # `version` parameter is the actionlint binary version this action
        # downloads, separate from the action's own SHA pin.
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8
        with:
          version: v1.7.10

  zizmor:
    name: zizmor (GHA security audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned by SHA against tag-move attacks.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5 — pinned by SHA.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: pip install zizmor==1.24.1

      - name: Run zizmor (single invocation, SARIF output, exit captured)
        # zizmor exit codes: 0 = clean, 13 = findings, 14 = analysis error.
        # `--persona regular` is the default; bump to `--persona pedantic`
        # locally to surface lower-severity issues during refactors.
        # `-q` suppresses the cosmetic INFO banner; audit results unaffected.
        id: zizmor
        run: |
          set +e
          zizmor -q --no-progress --format sarif . > zizmor.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF
        # github/codeql-action v3 — pinned by SHA. Runs unconditionally so
        # findings reach the security tab even when zizmor exit was non-zero.
        if: always()
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Propagate zizmor exit code
        # SARIF was uploaded above; now fail the job if zizmor reported
        # anything. Single source of truth for the analysis (no double-run
        # disagreement window).
        if: always() && steps.zizmor.outputs.exit_code != '0'
        env:
          ZIZMOR_EXIT: ${{ steps.zizmor.outputs.exit_code }}
        run: |
          case "$ZIZMOR_EXIT" in
            13)
              echo "::error::zizmor found security issues — see GHA Security tab"
              exit 1
              ;;
            *)
              echo "::error::zizmor analysis failed (exit $ZIZMOR_EXIT)"
              exit 1
              ;;
          esac

  hadolint:
    name: hadolint (Dockerfile lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned by SHA.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run hadolint on all Dockerfiles
        # hadolint/hadolint-action v3.1.0 — pinned by SHA.
        # `recursive: true` finds Dockerfiles anywhere in the tree (excluding
        # the worktree-sibling-cleanup directory and vendor).
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5
        with:
          recursive: true
          ignore: DL3008,DL3009  # apt without version pin (we accept the trade-off, like Dependabot's docker-tag stance)
          # Bypass DL3007 (latest tag) only inside vendor / .worktrees; recursive walk skips dot-dirs by default.

  shellcheck:
    name: shellcheck (shell-script lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned by SHA.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run shellcheck
        # ludeeus/action-shellcheck v2.0.0 — pinned by SHA.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          # Skip vendor + worktree directories. The .githooks tree is in
          # scope so the pre-commit hook itself gets linted by CI.
          ignore_paths: "vendor services/api/vendor frontend/node_modules .worktrees"
          # SC1091: "shell file not found" — fires on `source` of files
          # the linter cannot resolve at lint time (our hook sources
          # config.local.sh which may not exist). Acceptable noise.
          severity: warning

  test-db-safety:
    name: test-db safety guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned by SHA.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run DATABASE_URL test guard
        run: |
          cd services/api
          go test ./internal/migrate/migrations -run TestForbidsDirectDatabaseURLInTests -count=1

  large-files:
    name: Block files > 500 KB outside whitelist
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned by SHA against tag-move attacks.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine diff range
        id: range
        # SHA values from event payload pass through env vars (not template
        # interpolation in run scripts) — eliminates the template-injection
        # surface even though SHAs are 40-char hex and intrinsically safe.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            before="$PUSH_BEFORE_SHA"
            head="$PUSH_AFTER_SHA"
            if [ -z "$before" ] \
                || [ "$before" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
                base=$(git merge-base origin/main "$head" 2>/dev/null || echo "$head~1")
            else
                base="$before"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Check sizes
        # Reads two pure-DATA allowlist files (paths + basename-regex) from
        # ORIGIN/MAIN, not from the PR worktree. This prevents a malicious
        # PR from widening the size-gate by editing the allowlist alongside
        # a large-binary commit. Same trust-boundary pattern as the
        # canonical-pre-commit-from-main loader in pre-commit-guard.yml.
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          THRESHOLD_KB: "500"
        run: |
          set -euo pipefail
          # Load allowlist from origin/main (trusted) into temp files. On the
          # very first push to main these refs don't exist yet — fall back to
          # the worktree copy (no untrusted-PR-author exists at that point).
          PATHS_FILE=$(mktemp)
          BASENAMES_FILE=$(mktemp)
          if git cat-file -e origin/main:.githooks/large-files-allowlist-paths.txt 2>/dev/null; then
            git show origin/main:.githooks/large-files-allowlist-paths.txt > "$PATHS_FILE"
            git show origin/main:.githooks/large-files-allowlist-basenames.re > "$BASENAMES_FILE"
          else
            cp .githooks/large-files-allowlist-paths.txt "$PATHS_FILE"
            cp .githooks/large-files-allowlist-basenames.re "$BASENAMES_FILE"
            echo "::warning::origin/main has no large-files allowlist yet — using worktree copy. Future runs will use canonical."
          fi
          # Parse paths (reject globs / parent traversal / absolute).
          LARGE_FILES_EXEMPT_PATHS=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              \#*) continue ;;
              */../*|/*|*\**|*\?*|*\[*)
                echo "::error::dangerous path-prefix '$line' in large-files allowlist (origin/main copy)"
                exit 2
                ;;
            esac
            LARGE_FILES_EXEMPT_PATHS+=("$line")
          done < "$PATHS_FILE"
          BASENAMES_RE=$(grep -m1 -vE '^(\s*#|\s*$)' "$BASENAMES_FILE" || true)
          if [ -z "$BASENAMES_RE" ]; then
            echo "::error::empty basename-regex in allowlist (origin/main copy)"
            exit 2
          fi
          base="$BASE_SHA"
          head="$HEAD_SHA"
          violations=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            [ -f "$path" ] || continue
            # Path-prefix allowlist (literal prefixes, not glob).
            skip=false
            for prefix in "${LARGE_FILES_EXEMPT_PATHS[@]}"; do
              case "$path" in "$prefix"*) skip=true; break;; esac
            done
            [ "$skip" = "true" ] && continue
            # Basename regex allowlist.
            base_name="${path##*/}"
            if [[ "$base_name" =~ $BASENAMES_RE ]]; then
              continue
            fi
            size_kb=$(($(stat -c%s "$path") / 1024))
            if [ "$size_kb" -gt "$THRESHOLD_KB" ]; then
              echo "::error file=$path::large file ($size_kb KB > $THRESHOLD_KB KB threshold). Extend the canonical allowlist in .githooks/large-files-allowlist-{paths.txt,basenames.re} (must be merged to main before this PR can land)."
              violations=$((violations + 1))
            fi
          done < <(git diff --diff-filter=AM --name-only "$base" "$head")
          if [ "$violations" -gt 0 ]; then
            echo "::error::$violations file(s) over threshold."
            exit 1
          fi
