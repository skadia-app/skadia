name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-tests:
    name: Tests / Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1 - pinned by SHA against tag-move attacks.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v7.1.0 - pinned by SHA.
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Run Go tests
        working-directory: services/api
        run: go test ./...

  sport-taxonomy-generator:
    name: Tests / Sport taxonomy generator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1 - pinned by SHA against tag-move attacks.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v7.1.0 - pinned by SHA.
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Check generated sport taxonomy artifacts
        run: scripts/generate-sport-taxonomy.sh --check

      - name: Check generated applicable modifier artifacts
        run: scripts/generate-applicable-modifiers.sh --check

      - name: Check generated system tag artifacts
        run: scripts/generate-tags.sh --check

      - name: Check generated gear schema artifacts
        run: scripts/generate-gear-schema.sh --check

  migration-tests:
    name: Tests / Migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: timescale/timescaledb-ha@sha256:a1fb8d618c2c835f7c90ac2731c0ab219129dc673304c3551d8dcdba2272c837
        env:
          POSTGRES_USER: skadia
          POSTGRES_PASSWORD: skadia_dev_password
          POSTGRES_DB: skadia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skadia -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1 - pinned by SHA against tag-move attacks.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        # actions/setup-go v7.1.0 - pinned by SHA.
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Test migration finalizer
        run: |
          bash -n scripts/finalize-migration.sh scripts/finalize_migration_internal/test.sh
          scripts/finalize_migration_internal/test.sh

      - name: Test setup scripts
        run: |
          bash -n scripts/setup.sh scripts/init-garage.sh scripts/setup_internal/test.sh scripts/init_garage_internal/test.sh
          scripts/setup_internal/test.sh
          scripts/init_garage_internal/test.sh

      - name: Check migration numbering finalized
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
            BASE_REF="origin/${PR_BASE_REF}" ./scripts/finalize-migration.sh --check
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$PUSH_BEFORE_SHA" ./scripts/finalize-migration.sh --check
          else
            echo "Skipping migration numbering check for this event."
          fi

      - name: Apply all migrations in isolated test DB
        run: ./scripts/test_db.sh ensure

      - name: Verify migration version
        run: |
          eval "$(./scripts/test_db.sh emit-url)"
          expected="$(find services/api/internal/migrate/migrations -maxdepth 1 -name '*_*.up.sql' -printf '%f\n' | awk -F_ '$1 ~ /^[0-9]+$/ { print $1 + 0 }' | sort -n | tail -1)"
          actual="$(psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 --no-psqlrc -tA -c "SELECT version FROM schema_migrations ORDER BY version DESC LIMIT 1")"
          dirty="$(psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 --no-psqlrc -tA -c "SELECT dirty FROM schema_migrations ORDER BY version DESC LIMIT 1")"
          test "$actual" = "$expected"
          test "$dirty" = "f"

      - name: Run migration tests
        run: |
          ./scripts/test_db.sh run -- sh -c 'cd services/api && go test -count=1 ./internal/migrate/migrations'

  frontend-tests:
    name: Tests / Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1 - pinned by SHA against tag-move attacks.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        # actions/setup-node v7.1.0 - pinned by SHA.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build
