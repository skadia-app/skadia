name: pre-commit guard

# Server-side enforcement of the same checks defined in .githooks/pre-commit
# and .githooks/commit-msg, plus a dedicated secret scan via gitleaks.
#
# Runs on every PR and push to main as a central backstop, regardless of
# whether the contributor has activated the local hook via core.hooksPath.
#
# Branch-protection note (manual repo setup):
#   Both jobs (`guard` and `gitleaks`) must be added to "Required status checks"
#   in the repository's branch protection rules so that a green `guard` cannot
#   merge while `gitleaks` is red. See `.github/BRANCH_PROTECTION.md` for the
#   recommended config.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  LC_ALL: C.UTF-8
  GIT_TERMINAL_PROMPT: "0"
  # CI loads the canonical hook from origin/main but checks out the PR tree.
  # The PR tree might contain a malicious .githooks/config.local.sh that would
  # otherwise neutralise the hook. Setting this var disables that sourcing
  # path inside the hook.
  SKADIA_HOOK_NO_LOCAL_CONFIG: "1"

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned by SHA against tag-move attacks.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine diff range
        id: range
        # Pass event-payload SHAs through env vars instead of `${{ ... }}`
        # template interpolation in the run script — eliminates the
        # template-injection surface that zizmor flags.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            # On push: compare against the parent commit. New branches whose
            # `before` is the zero SHA, or force-pushes whose `before` is no
            # longer reachable, fall back to `merge-base origin/main HEAD`.
            before="$PUSH_BEFORE_SHA"
            head="$PUSH_AFTER_SHA"
            if [ -z "$before" ] \
                || [ "$before" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
                base=$(git merge-base origin/main "$head" 2>/dev/null || echo "$head~1")
            else
                base="$before"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Load hook from main branch (not from PR)
        # Loading the hook from the PR branch would let a malicious PR ship a
        # neutered hook alongside its bad content. We load the canonical
        # version from origin/main instead. On the very first push to main,
        # there's nothing to load against — fall back to the working-tree
        # version since there's no untrusted PR-author yet.
        run: |
          if git cat-file -e origin/main:.githooks/pre-commit 2>/dev/null; then
              git show origin/main:.githooks/pre-commit > /tmp/canonical-pre-commit
              echo "Loaded canonical hook from origin/main"
          else
              cp .githooks/pre-commit /tmp/canonical-pre-commit
              echo "::warning::origin/main has no .githooks/pre-commit yet — using working-tree version. Future PRs will load the canonical version once main has the hook."
          fi
          chmod +x /tmp/canonical-pre-commit

      - name: Load public-content helper from main branch (not from PR)
        run: |
          if git cat-file -e origin/main:.githooks/public-content-guard 2>/dev/null; then
              git show origin/main:.githooks/public-content-guard > /tmp/canonical-public-content-guard
              echo "Loaded canonical public-content helper from origin/main"
          else
              cp .githooks/public-content-guard /tmp/canonical-public-content-guard
              echo "::warning::origin/main has no .githooks/public-content-guard yet — using working-tree version. Future PRs will load the canonical version once main has the helper."
          fi
          chmod +x /tmp/canonical-public-content-guard

      - name: Load commit-message hook from main branch (not from PR)
        run: |
          if git cat-file -e origin/main:.githooks/commit-msg 2>/dev/null; then
              git show origin/main:.githooks/commit-msg > /tmp/canonical-commit-msg
              echo "Loaded canonical commit-message hook from origin/main"
          else
              cp .githooks/commit-msg /tmp/canonical-commit-msg
              echo "::warning::origin/main has no .githooks/commit-msg yet — using working-tree version. Future PRs will load the canonical version once main has the hook."
          fi
          chmod +x /tmp/canonical-commit-msg

      - name: Run hook smoke tests
        env:
          SKADIA_COMMIT_MSG_HOOK: /tmp/canonical-commit-msg
          SKADIA_PUBLIC_CONTENT_GUARD: /tmp/canonical-public-content-guard
        run: |
          set -euo pipefail
          scripts/commit_msg_guard_internal/test.sh
          scripts/public_content_guard_internal/test.sh

      - name: Run canonical commit-message hook
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          head="$HEAD_SHA"

          COMMITS_FILE=$(mktemp)
          MSG_FILE=$(mktemp)
          trap 'rm -f "$COMMITS_FILE" "$MSG_FILE"' EXIT

          git rev-list --reverse "$base..$head" > "$COMMITS_FILE"
          if [ ! -s "$COMMITS_FILE" ]; then
              echo "No new commits in this range — skipping commit-message check."
              exit 0
          fi

          while IFS= read -r commit; do
              [ -z "$commit" ] && continue
              git log -1 --format=%B "$commit" > "$MSG_FILE"
              if ! /tmp/canonical-commit-msg "$MSG_FILE"; then
                  subject=$(git log -1 --format=%s "$commit")
                  echo "::error title=Commit message blocked::${commit:0:12} $subject"
                  exit 1
              fi
          done < "$COMMITS_FILE"

      - name: Run canonical commit-message hook on PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          MSG_FILE=$(mktemp)
          trap 'rm -f "$MSG_FILE"' EXIT
          printf '%s\n' "$PR_TITLE" > "$MSG_FILE"
          if ! /tmp/canonical-commit-msg "$MSG_FILE"; then
              echo "::error title=PR title blocked::Use a public-neutral title; it may become the default squash commit subject."
              exit 1
          fi

      - name: Guard hardening file deletions
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          head="$HEAD_SHA"

          deleted=$(
            git diff --name-only --diff-filter=D "$base...$head" -- \
              .githooks/pre-commit \
              .githooks/commit-msg \
              .githooks/public-content-guard \
              .github/workflows/pre-commit-guard.yml \
              scripts/commit_msg_guard_internal/test.sh \
              scripts/public_content_guard_internal/test.sh \
              || true
          )
          if [ -n "$deleted" ]; then
              echo "::error title=Hardening file deletion blocked::These public-release guard files may not be deleted without changing the guard policy first."
              printf '%s\n' "$deleted"
              exit 1
          fi

      - name: Stage diff into index
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          head="$HEAD_SHA"
          echo "Comparing $base...$head"

          # `...` (three dots) = symmetric diff via merge-base, the correct
          # semantic for "what does this PR add". `AMR` covers Add, Modify,
          # and Rename — renames with content changes can carry secrets.
          # Deletions have no added lines to scan; protected guard-file
          # deletions are blocked in the previous step.
          #
          # NUL-separated diff goes to a TEMP FILE, never to a shell
          # variable. Bash variable assignment via $(...) strips NUL
          # bytes, which would concatenate filenames into one corrupt
          # blob and either stage the wrong path or fail outright on
          # multi-file PRs.
          DIFF_FILE=$(mktemp)
          trap 'rm -f "$DIFF_FILE"' EXIT
          git diff --name-only --diff-filter=AMR -z "$base...$head" > "$DIFF_FILE" || true
          if [ ! -s "$DIFF_FILE" ]; then
              echo "No file additions/modifications/renames in this range — skipping check."
              exit 0
          fi

          # Sanity cap: if a single PR/push touches more than 5000 files
          # (force-push of a long-divergent branch, history rewrite, etc.) the
          # subsequent staging loop becomes minutes-long. Bail loudly instead.
          file_count=$(tr -cd '\0' < "$DIFF_FILE" | wc -c)
          if [ "$file_count" -gt 5000 ]; then
              echo "::error::diff range covers $file_count files — refusing to scan a window this large. Open a smaller PR or force-push to a clean base."
              exit 1
          fi

          # Reset the index to the base tree while keeping the checked-out
          # working tree. Without this, a clean PR checkout has no staged diff
          # and the pre-commit mirror would scan nothing.
          git reset --mixed "$base"

          # Force-add even files that are now in .gitignore — staging is what
          # the hook scans, not the gitignore. Read the NUL-separated list
          # directly from the file via xargs -0 to preserve filenames with
          # newlines or other special characters.
          xargs -0 -r git add -f -- < "$DIFF_FILE"

      - name: Run canonical pre-commit hook
        env:
          SKADIA_PUBLIC_CONTENT_GUARD: /tmp/canonical-public-content-guard
        run: /tmp/canonical-pre-commit

  gitleaks:
    # Independent secret scan with a much larger pattern library than the
    # in-house hook. Run in parallel — both must pass.
    runs-on: ubuntu-24.04
    permissions:
      # Read-only is sufficient as a gate. `pull-requests: write` would
      # let gitleaks-action post inline annotations, but combining write
      # permissions with a `pull_request` checkout-of-PR-head is the
      # exact pattern that Scorecard's Dangerous-Workflow check flags.
      # The job-failure signal already reaches the PR via the required-
      # status-check column; annotations are a nice-to-have, not a gate.
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned by SHA.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        # gitleaks-action v2.3.9 — pinned by SHA against tag-move attacks.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free Starter license for public repos; private/org repos need
          # GITLEAKS_LICENSE in the repo's secrets.
