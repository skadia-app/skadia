modifiers:
  - key: is_electric
    labels: {de: E-Antrieb}
    go_field: IsElectric
    ts_field: isElectric
    json_key: is_electric
    activity_column: is_electric
    action_name: set_electric
    action_param: electric
    shadowfs_token: electric
    capabilities:
      activity_state: true
      modifier_filter: true
      modifier_patch: true
      taxonomy_default: false
    subsystems: [bestefforts, dataimport, gear, heatmap, quick-edit, routefilter, rules, shadowfs]
    # Soft per-gear_type recommendations. UX hint only — backend never enforces.
    # recommended_for: gear types where an electric drive is well-established.
    # not_recommended_for: gear types where an electric drive is atypical.
    recommended_for:
      - bike.city.citybike
      - bike.city.dutch
      - bike.city.urban
      - bike.city.fitness
      - bike.city.folding
      - bike.city.cruiser
      - bike.trekking.trekking
      - bike.trekking.expedition
      - bike.cargo.long_john
      - bike.cargo.longtail
      - bike.cargo.backpacker
      - bike.mtb.all_mountain_trail
      - bike.mtb.enduro
      - bike.gravel.gravelbike
    not_recommended_for:
      - bike.road.track
      - bike.mtb.trial
      - bike.bmx.race
      - bike.bmx.freestyle
      - bike.bmx.dirt
      - bike.bmx.flatland
      - bike.kids
      - bike.balance

