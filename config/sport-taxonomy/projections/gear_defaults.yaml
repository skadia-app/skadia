projection_sources: [strava]

# Default applicable sport predicates per gear type key.
# Types absent from this list have no taxonomy-driven default (empty slice).
# apparel.* types are sport-orthogonal; their sport mapping is handled via
# the subcategory attribute on the frontend side (Phase 8).
applicable_sport_predicates:
  - gear_type_key: bike
    predicates:
      - {sport_type: cycling}
  - gear_type_key: bike.balance
    predicates:
      - {sport_type: cycling}
