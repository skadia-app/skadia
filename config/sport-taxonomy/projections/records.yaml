category_profiles:
  - {key: running_full, category_sets: [distances_running, elevation, power, superlatives_with_elevation]}
  - {key: running_stationary, category_sets: [distances_running, power, superlatives_basic]}
  - {key: cycling_full, category_sets: [distances_cycling, elevation, power, superlatives_with_elevation]}
  - {key: cycling_electric, category_sets: [distances_cycling, elevation, superlatives_with_elevation]}
  - {key: cycling_stationary, category_sets: [distances_cycling, superlatives_basic]}
  - {key: hiking_full, category_sets: [distances_hiking, elevation, superlatives_with_elevation]}
  - {key: swim_pool, category_sets: [distances_swim_pool, superlatives_basic]}
  - {key: swim_open_water, category_sets: [distances_swim_open_water, superlatives_basic]}

record_groups:
  - key: running
    labels: {de: Laufen}
    main_category: laufen
    color: "#3B82F6"
    category_profile: running_full
    match:
      - priority: 10
        sport_type: running
        exclude_sub_types: [trail, indoor_running, treadmill]
        modifiers: {is_indoor: false, is_virtual: false}

  - key: running_trail
    labels: {de: Laufen (Trail)}
    main_category: laufen
    color: "#3B82F6"
    category_profile: running_full
    match:
      - priority: 80
        sport_type: running
        sub_types: [trail]

  - key: running_indoor
    labels: {de: Laufen (Indoor)}
    main_category: laufen
    color: "#3B82F6"
    category_profile: running_stationary
    match:
      - priority: 90
        sport_type: running
        sub_types: [indoor_running, treadmill]
      - priority: 89
        sport_type: running
        modifiers: {is_indoor: true}

  - key: running_virtual
    labels: {de: Laufen (Virtuell)}
    main_category: laufen
    color: "#3B82F6"
    category_profile: running_stationary
    match:
      - priority: 100
        sport_type: running
        modifiers: {is_virtual: true}

  - key: cycling
    labels: {de: Radfahren}
    main_category: radfahren
    color: "#F97316"
    category_profile: cycling_full
    match:
      - priority: 10
        sport_type: cycling
        exclude_sub_types: [indoor_cycling]
        modifiers: {is_electric: false, is_indoor: false, is_virtual: false}

  - key: cycling_electric
    labels: {de: E-Bike}
    main_category: radfahren
    color: "#F97316"
    category_profile: cycling_electric
    match:
      - priority: 80
        sport_type: cycling
        modifiers: {is_electric: true}

  - key: cycling_virtual
    labels: {de: Radfahren (Stationär)}
    main_category: radfahren
    color: "#F97316"
    category_profile: cycling_stationary
    match:
      - priority: 100
        sport_type: cycling
        sub_types: [indoor_cycling]
      - priority: 100
        sport_type: cycling
        sub_types: [spin]
      - priority: 99
        sport_type: cycling
        modifiers: {is_virtual: true}
      - priority: 98
        sport_type: cycling
        modifiers: {is_indoor: true}

  - key: hiking
    labels: {de: Wandern}
    main_category: wandern
    color: "#22C55E"
    category_profile: hiking_full
    match:
      - priority: 10
        sport_type: hiking
      - priority: 10
        sport_type: mountaineering
      - priority: 10
        sport_type: snowshoeing

  - key: swim_pool
    labels: {de: Schwimmen (Becken)}
    main_category: schwimmen
    color: "#06B6D4"
    category_profile: swim_pool
    badge: B
    match:
      - priority: 90
        sport_type: swimming
        sub_types: [lap_swimming]

  - key: swim_ow
    labels: {de: Schwimmen (Freiwasser)}
    main_category: schwimmen
    color: "#06B6D4"
    category_profile: swim_open_water
    badge: FW
    match:
      - priority: 10
        sport_type: swimming
        sub_types: ["", open_water]

main_categories:
  - key: laufen
    labels: {de: Laufen}
    color: "#3B82F6"
    record_groups: [running, running_trail, running_indoor, running_virtual]
    sub_filters:
      - {label: Alle, record_groups: [running, running_trail, running_indoor, running_virtual]}
      - {label: Straße, record_groups: [running]}
      - {label: Trail, record_groups: [running_trail]}
      - {label: Stationär, record_groups: [running_indoor, running_virtual]}
    power_curve: {label: Laufen, record_groups: [running, running_trail, running_indoor, running_virtual]}

  - key: radfahren
    labels: {de: Radfahren}
    color: "#F97316"
    record_groups: [cycling, cycling_electric, cycling_virtual]
    sub_filters:
      - {label: Alle, record_groups: [cycling, cycling_electric, cycling_virtual]}
      - {label: Radfahren, record_groups: [cycling]}
      - {label: E-Bike, record_groups: [cycling_electric]}
      - {label: Stationär, record_groups: [cycling_virtual]}
    power_curve: {label: Radfahren, record_groups: [cycling]}

  - key: wandern
    labels: {de: Wandern}
    color: "#22C55E"
    record_groups: [hiking]
    sub_filters: []

  - key: schwimmen
    labels: {de: Schwimmen}
    color: "#06B6D4"
    record_groups: [swim_ow, swim_pool]
    sub_filters:
      - {label: Alle, record_groups: [swim_ow, swim_pool]}
      - {label: Freiwasser, record_groups: [swim_ow]}
      - {label: Becken, record_groups: [swim_pool]}
