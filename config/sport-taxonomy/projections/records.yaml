record_groups:
  - key: running
    labels: {de: Laufen, en: Running, fr: Course à pied, it: Corsa, es: Carrera}
    main_category: laufen
    color: "#3B82F6"
    category_profile: running_full
    match:
      - priority: 10
        sport_type: running
        exclude_sub_types: [trail, indoor_running, treadmill]
        modifiers: {is_indoor: false, is_virtual: false}

  - key: running_trail
    labels: {de: Laufen (Trail), en: Trail running, fr: Trail, it: Trail running, es: Trail running}
    main_category: laufen
    color: "#3B82F6"
    category_profile: running_full
    match:
      - priority: 80
        sport_type: running
        sub_types: [trail]

  - key: running_indoor
    labels: {de: Laufen (Indoor), en: Indoor running, fr: Course en salle, it: Corsa indoor, es: Carrera indoor}
    main_category: laufen
    color: "#3B82F6"
    category_profile: running_stationary
    match:
      - priority: 90
        sport_type: running
        sub_types: [indoor_running, treadmill]
      - priority: 89
        sport_type: running
        modifiers: {is_indoor: true}

  - key: running_virtual
    labels: {de: Laufen (Virtuell), en: Virtual running, fr: Course virtuelle, it: Corsa virtuale, es: Carrera virtual}
    main_category: laufen
    color: "#3B82F6"
    category_profile: running_stationary
    match:
      - priority: 100
        sport_type: running
        modifiers: {is_virtual: true}

  - key: cycling
    labels: {de: Radfahren, en: Cycling, fr: Vélo, it: Ciclismo, es: Ciclismo}
    main_category: radfahren
    color: "#F97316"
    category_profile: cycling_full
    match:
      - priority: 10
        sport_type: cycling
        exclude_sub_types: [indoor_cycling]
        modifiers: {is_electric: false, is_indoor: false, is_virtual: false}

  - key: cycling_electric
    labels: {de: E-Bike, en: E-bike, fr: E-bike, it: E-bike, es: E-bike}
    main_category: radfahren
    color: "#F97316"
    category_profile: cycling_electric
    match:
      - priority: 80
        sport_type: cycling
        modifiers: {is_electric: true}

  - key: cycling_virtual
    labels: {de: Radfahren (Stationär), en: Stationary cycling, fr: Vélo stationnaire, it: Ciclismo stazionario, es: Ciclismo estacionario}
    main_category: radfahren
    color: "#F97316"
    category_profile: cycling_stationary
    match:
      - priority: 100
        sport_type: cycling
        sub_types: [indoor_cycling]
      - priority: 100
        sport_type: cycling
        sub_types: [spin]
      - priority: 99
        sport_type: cycling
        modifiers: {is_virtual: true}
      - priority: 98
        sport_type: cycling
        modifiers: {is_indoor: true}

  - key: hiking
    labels: {de: Wandern, en: Hiking, fr: Randonnée, it: Escursionismo, es: Senderismo}
    main_category: wandern
    color: "#22C55E"
    category_profile: hiking_full
    match:
      - priority: 10
        sport_type: hiking
      - priority: 10
        sport_type: mountaineering
      - priority: 10
        sport_type: snowshoeing

  - key: swim_pool
    labels: {de: Schwimmen (Becken), en: Pool swimming, fr: Natation en bassin, it: Nuoto in piscina, es: Natación en piscina}
    main_category: schwimmen
    color: "#06B6D4"
    category_profile: swim_pool
    badge: B
    match:
      - priority: 90
        sport_type: swimming
        sub_types: [lap_swimming]

  - key: swim_ow
    labels: {de: Schwimmen (Freiwasser), en: Open water swimming, fr: Natation en eau libre, it: Nuoto in acque libere, es: Natación en aguas abiertas}
    main_category: schwimmen
    color: "#06B6D4"
    category_profile: swim_open_water
    badge: FW
    match:
      - priority: 10
        sport_type: swimming
        sub_types: ["", open_water]

main_categories:
  - key: laufen
    labels: {de: Laufen, en: Running, fr: Course à pied, it: Corsa, es: Carrera}
    color: "#3B82F6"
    record_groups: [running, running_trail, running_indoor, running_virtual]
    sub_filters:
      - {key: all, labels: {de: Alle, en: All, fr: Tout, it: Tutti, es: Todo}, record_groups: [running, running_trail, running_indoor, running_virtual]}
      - {key: road, labels: {de: Straße, en: Road, fr: Route, it: Strada, es: Carretera}, record_groups: [running]}
      - {key: trail, labels: {de: Trail, en: Trail, fr: Trail, it: Trail, es: Trail}, record_groups: [running_trail]}
      - {key: stationary, labels: {de: Stationär, en: Stationary, fr: Stationnaire, it: Stazionario, es: Estacionario}, record_groups: [running_indoor, running_virtual]}
    power_curve: {key: power, labels: {de: Laufen, en: Running, fr: Course à pied, it: Corsa, es: Carrera}, record_groups: [running, running_trail, running_indoor, running_virtual]}

  - key: radfahren
    labels: {de: Radfahren, en: Cycling, fr: Vélo, it: Ciclismo, es: Ciclismo}
    color: "#F97316"
    record_groups: [cycling, cycling_electric, cycling_virtual]
    sub_filters:
      - {key: all, labels: {de: Alle, en: All, fr: Tout, it: Tutti, es: Todo}, record_groups: [cycling, cycling_electric, cycling_virtual]}
      - {key: cycling, labels: {de: Radfahren, en: Cycling, fr: Vélo, it: Ciclismo, es: Ciclismo}, record_groups: [cycling]}
      - {key: electric, labels: {de: E-Bike, en: E-bike, fr: E-bike, it: E-bike, es: E-bike}, record_groups: [cycling_electric]}
      - {key: stationary, labels: {de: Stationär, en: Stationary, fr: Stationnaire, it: Stazionario, es: Estacionario}, record_groups: [cycling_virtual]}
    power_curve: {key: power, labels: {de: Radfahren, en: Cycling, fr: Vélo, it: Ciclismo, es: Ciclismo}, record_groups: [cycling]}

  - key: wandern
    labels: {de: Wandern, en: Hiking, fr: Randonnée, it: Escursionismo, es: Senderismo}
    color: "#22C55E"
    record_groups: [hiking]
    sub_filters: []

  - key: schwimmen
    labels: {de: Schwimmen, en: Swimming, fr: Natation, it: Nuoto, es: Natación}
    color: "#06B6D4"
    record_groups: [swim_ow, swim_pool]
    sub_filters:
      - {key: all, labels: {de: Alle, en: All, fr: Tout, it: Tutti, es: Todo}, record_groups: [swim_ow, swim_pool]}
      - {key: open_water, labels: {de: Freiwasser, en: Open water, fr: Eau libre, it: Acque libere, es: Aguas abiertas}, record_groups: [swim_ow]}
      - {key: pool, labels: {de: Becken, en: Pool, fr: Bassin, it: Piscina, es: Piscina}, record_groups: [swim_pool]}
