name: routing
description: "Routenplanung, Navigation, Orts-/Feature-Auflösung, Abdeckung, Profile"

schema_excerpt: |
  osm_ways: id, osm_id, name, highway, surface, tracktype, sac_scale, mtb_scale,
    length_m, avg_slope, oneway, bridge, tunnel, is_lift, source, target, cost, reverse_cost, geom
  osm_pois: id, osm_id, name, category, subtype, ele, geom GEOMETRY(Geometry,4326) -- Points (Nodes), Polygons (closed Ways), MultiPolygons (Relations)
  osm_routes: id, osm_id, name, ref, route, network, colour, distance, geom

domain_knowledge: |
  - Orts- und Feature-Namen nie als Koordinaten raten. Erst get_agent_service_status
    nutzen, dann resolve_user_location für gespeicherte Orte, geocode_place für
    Orts-/Adressnamen oder resolve_route_feature für See, Fluss, Wald, Gipfel,
    Pass, Hütte, Trail oder ähnliche Geländeziele nutzen.
  - Danach get_routing_coverage prüfen. Wenn keine Abdeckung vorliegt, klar sagen
    und keine Route erfinden.
  - Profile immer über list_routing_profiles ermitteln; keine festen Profilnamen
    oder veralteten Standardprofile voraussetzen.
  - Profil-Auswahl basiert auf Nutzeranfrage: Sportart, Schwierigkeit, Terrain,
    Direktverbindung vs. Rundtour, Höhenmeter/Steigung, Oberfläche, Verkehr,
    Wetter- und Abdeckungsgrenzen.
  - Fein-Tuning nur mit Parametern verwenden, die list_routing_profiles für das
    gewählte Profil zurückgibt.
  - SAC-Skala: T1=Wandern, T2=Bergwandern, T3=Anspruchsvoll, T4=Alpinwandern,
    T5=Anspruchsvolles Alpinwandern, T6=Schwieriges Alpinwandern
  - MTB-Skala: S0=Leicht, S1=Mittel, S2=Schwierig, S3=Sehr schwierig, S4=Extrem, S5=Unfahrbar
  - Via-Ferrata-/Kletter-Schwierigkeiten nur als Constraint nennen, wenn das
    Tool sie als angewendet meldet. Sonst als unsupported_constraint erklären.
  - Dauer ist kein Routing-Input. Bei "2 Stunden", "halber Tag" usw. keine
    Dauer schätzen und kein duration-Argument senden; stattdessen nach Distanz,
    Anstieg, Schwierigkeit, Routentyp oder Profil fragen.
  - Bei langen Punkt-zu-Punkt-Wünschen oder Luftlinienfragen analyze_route_points
    nutzen. Wenn max_direct_leg_m überschritten ist, Zwischenpunkte verlangen.
  - Zielrouten/Rundtouren: suggest_route_goal aktuell nur verwenden, um sauber
    zu erkennen, was real unterstützt ist. Keine Zielrouten-Kandidaten
    versprechen, wenn das Tool `unsupported_backend_path`,
    `unsupported_constraint`, `missing_coverage` oder `provider_unavailable`
    meldet.
  - Tool-Antworten mit disabled, unconfigured, rate_limited,
    requires_user_confirmation, skipped_by_privacy_policy oder timed_out
    sachlich melden und nicht wiederholt dieselbe externe Anfrage senden.
  - Wetter und bisherige Aktivitätsdaten sind Zusatzkontext: query_weather_at_point_time
    und query_activity_terrain_summary nach Orts-/Routenauflösung nutzen, nicht als
    Ersatz für Abdeckungs- und Profilprüfung.
  - Workflow: 1) Wunsch verstehen -> 2) Service-Status prüfen ->
    3) Orte/Features auflösen -> 4) Abdeckung, Distanzdiagnose und Profile prüfen ->
    5) Ziel/Waypoints bestimmen -> 6) Route als Vorschau planen ->
    7) angewendete/nicht unterstützte Constraints und Post-Validation melden.
  - Planung ist read-only. Speichern oder andere Schreibaktionen nur ausführen,
    wenn ein freigegebenes Write-Tool explizit verfügbar ist und bestätigt wurde.

tools:
  - resolve_route_place
  - resolve_user_location
  - geocode_place
  - resolve_route_feature
  - get_agent_service_status
  - get_routing_coverage
  - analyze_route_points
  - list_routing_profiles
  - plan_route_between
  - search_pois_nearby
  - search_trails_by_difficulty
  - plan_route
  - suggest_route_goal
  - query_weather_at_point_time
  - query_activity_terrain_summary
  - search_pois_on_route
  - get_isochrone
  - query_geo_features
  - search_routes
  - query_coverage
  - resolve_entity

few_shot_examples:
  - q: "Plane mir eine gemütliche Wanderung ab Startort zu einem See mit Einkehrmöglichkeit"
    steps:
      - tool: resolve_route_place
        args: '{"query": "Startort", "kind": "place"}'
      - tool: resolve_route_feature
        args: '{"query": "See", "feature_kind": "lake", "relation": "target"}'
      - tool: analyze_route_points
        args: '{"points": [{"ref": "<start_ref>"}, {"ref": "<lake_ref>"}], "intent": "direct_route"}'
      - tool: get_routing_coverage
        args: '{"place_refs": ["<start_ref>"], "feature_refs": ["<lake_ref>"], "intent": "direct"}'
      - tool: list_routing_profiles
        args: '{}'
      - tool: plan_route_between
        args: '{"from": {"ref": "<start_ref>"}, "to": {"ref": "<lake_ref>"}, "profile_key": "<profile_from_list_routing_profiles>"}'
  - q: "Ich brauche eine direkte Gravel-Route von Startort nach Zielort mit wenig Verkehr"
    steps:
      - tool: resolve_route_place
        args: '{"query": "Startort", "kind": "place"}'
      - tool: resolve_route_place
        args: '{"query": "Zielort", "kind": "place"}'
      - tool: analyze_route_points
        args: '{"points": [{"ref": "<start_ref>"}, {"ref": "<goal_ref>"}], "intent": "direct_route"}'
      - tool: get_routing_coverage
        args: '{"place_refs": ["<start_ref>", "<goal_ref>"], "intent": "direct"}'
      - tool: list_routing_profiles
        args: '{}'
      - tool: plan_route_between
        args: '{"from": {"ref": "<start_ref>"}, "to": {"ref": "<goal_ref>"}, "profile_key": "<profile_from_list_routing_profiles>"}'
  - q: "Finde eine Rundtour ab Startort mit viel Wald und moderatem Anstieg"
    steps:
      - tool: resolve_route_place
        args: '{"query": "Startort", "kind": "place"}'
      - tool: resolve_route_feature
        args: '{"query": "Wald", "feature_kind": "forest", "relation": "pass_near"}'
      - tool: get_routing_coverage
        args: '{"place_refs": ["<start_ref>"], "feature_refs": ["<forest_ref>"], "intent": "goal"}'
      - tool: list_routing_profiles
        args: '{}'
      - tool: suggest_route_goal
        args: '{"start": {"ref": "<start_ref>"}, "round_trip": true, "elevation_mode": "moderate", "profile_key": "<profile_from_list_routing_profiles>", "preferences": {"min_forest_share": 50}}'
