system_tags:
  - modifier_key: is_electric
    system_tag: E-Bike
    color: "#16A34A"
    description: Automatisch bei elektrischen Radfahrten
    readonly_sync: true
    only_sport_type: cycling
    label_context: cycling
  - modifier_key: is_indoor
    system_tag: Indoor
    color: "#3B82F6"
    description: Automatisch bei Indoor-Aktivitäten
    readonly_sync: true
  - modifier_key: is_virtual
    system_tag: virtuell
    color: "#8B5CF6"
    description: Automatisch bei virtuellen Aktivitäten
    readonly_sync: true
  - modifier_key: is_commute
    system_tag: Pendeln
    color: "#6B7280"
    description: Automatisch bei Pendel-Aktivitäten
    readonly_sync: false
