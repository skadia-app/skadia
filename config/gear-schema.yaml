gear_types:
  # ---- Bike hierarchy ----
  - key: bike
    label_de: Fahrrad
    scope: bike
    default_assignment_role_key: primary
    attribute_keys:
      - bike.frame_type
      - bike.modifier
      - bike.frame_design
      - bike.frame_material
      - bike.wheel_size
      - bike.wheel_size_front
      - bike.wheel_size_rear
      - bike.frame_size_alpha
      - bike.frame_size_cm
      - bike.geometry
      - bike.bottle_cage_count
      - bike.cable_routing
      - bike.fender_presence
      - bike.kickstand_presence
      - bike.rear_axle_standard
      - bike.bottom_bracket_standard
      - bike.headtube_type
      - bike.seatpost_diameter_mm
      - bike.brake_mount
      - bike.max_system_weight_kg

  - key: bike.road
    label_de: Rennrad
    scope: bike
    parent_key: bike
    default_assignment_role_key: primary
    slots:
      - {key: frame, label_de: Rahmen, component_type: bike.frame}
      - {key: fork, label_de: Gabel, component_type: bike.fork}
