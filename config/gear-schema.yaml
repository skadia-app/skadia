# Registry of unit groups. Each attribute with `unit_group: <key>` must list
# `allowed_units` as a subset of the registry entry's `allowed_units`.
# Unit keys are English schema-keys; user-facing labels live in the frontend.
unit_groups:
  - key: length
    label_de: Länge
    allowed_units: [mm, in]
    canonical_unit: mm
  - key: length_angle
    label_de: Länge & Winkel
    allowed_units: [mm, deg]
  - key: weight
    label_de: Gewicht
    allowed_units: [kg]
    canonical_unit: kg
  - key: volume
    label_de: Volumen
    allowed_units: [l, ml]
    canonical_unit: ml
  - key: angle
    label_de: Winkel
    allowed_units: [deg]
    canonical_unit: deg
  - key: pressure
    label_de: Druck
    allowed_units: [bar, psi]
    canonical_unit: bar
  - key: spring_rate
    label_de: Federrate
    allowed_units: [n_per_mm, lb_per_in]
    canonical_unit: n_per_mm
  - key: voltage
    label_de: Spannung
    allowed_units: [V]
    canonical_unit: V
  - key: energy
    label_de: Energie
    allowed_units: [Wh]
    canonical_unit: Wh
  - key: count
    label_de: Anzahl
    allowed_units: [clicks, turns, pieces]
    canonical_unit: pieces

