# Registry of unit groups. Each attribute with `unit_group: <key>` must list
# `allowed_units` as a subset of the registry entry's `allowed_units`.
# Unit keys are English schema-keys; user-facing labels live in the frontend.
unit_groups:
  - key: length
    label_de: Länge
    labels: {de: Länge, en: Length, fr: Longueur, it: Lunghezza, es: Longitud}
    allowed_units: [mm, in]
    canonical_unit: mm
  - key: length_angle
    label_de: Länge & Winkel
    labels: {de: "Länge & Winkel", en: "Length & angle", fr: Longueur et angle, it: Lunghezza e angolo, es: Longitud y ángulo}
    allowed_units: [mm, deg]
  - key: weight
    label_de: Gewicht
    labels: {de: Gewicht, en: Weight, fr: Poids, it: Peso, es: Peso}
    allowed_units: [kg]
    canonical_unit: kg
  - key: volume
    label_de: Volumen
    labels: {de: Volumen, en: Volume, fr: Volume, it: Volume, es: Volumen}
    allowed_units: [l, ml]
    canonical_unit: ml
  - key: angle
    label_de: Winkel
    labels: {de: Winkel, en: Angle, fr: Angle, it: Angolo, es: Ángulo}
    allowed_units: [deg]
    canonical_unit: deg
  - key: pressure
    label_de: Druck
    labels: {de: Druck, en: Pressure, fr: Pression, it: Pressione, es: Presión}
    allowed_units: [bar, psi]
    canonical_unit: bar
  - key: spring_rate
    label_de: Federrate
    labels: {de: Federrate, en: Spring rate, fr: Raideur du ressort, it: Rigidità della molla, es: Constante del muelle}
    allowed_units: [n_per_mm, lb_per_in]
    canonical_unit: n_per_mm
  - key: voltage
    label_de: Spannung
    labels: {de: Spannung, en: Voltage, fr: Tension, it: Tensione, es: Tensión}
    allowed_units: [V]
    canonical_unit: V
  - key: energy
    label_de: Energie
    labels: {de: Energie, en: Energy, fr: Énergie, it: Energia, es: Energía}
    allowed_units: [Wh]
    canonical_unit: Wh
  - key: count
    label_de: Anzahl
    labels: {de: Anzahl, en: Count, fr: Nombre, it: Quantità, es: Cantidad}
    allowed_units: [clicks, turns, pieces]
    canonical_unit: pieces

